<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="pipeline-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="pipeline-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="ambient-cyan" cx="15%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambient-purple" cx="85%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for neon glows -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="text-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <style>
      .glow-pulse {
        animation: pulse-glow 6s ease-in-out infinite alternate;
      }
      .pipeline-flow-1 {
        stroke-dasharray: 12 16;
        animation: flow-left 18s linear infinite;
      }
      .pipeline-flow-2 {
        stroke-dasharray: 8 12;
        animation: flow-right 22s linear infinite;
      }
      .pill-float-1 {
        animation: float-1 5s ease-in-out infinite;
      }
      .pill-float-2 {
        animation: float-2 6s ease-in-out infinite;
      }
      .pill-float-3 {
        animation: float-1 7s ease-in-out infinite 1s;
      }
      .pill-float-4 {
        animation: float-2 5.5s ease-in-out infinite 0.5s;
      }
      .node-pulse {
        animation: ping 3s cubic-bezier(0, 0, 0.2, 1) infinite;
        transform-origin: center;
      }

      @keyframes flow-left {
        from { stroke-dashoffset: 280; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flow-right {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 240; }
      }
      @keyframes float-1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes float-2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }
      @keyframes pulse-glow {
        0% { opacity: 0.25; transform: scale(0.98); }
        100% { opacity: 0.55; transform: scale(1.02); }
      }
      @keyframes ping {
        0% { r: 5; opacity: 1; }
        75%, 100% { r: 14; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="110" r="280" fill="url(#ambient-cyan)" class="glow-pulse" />
  <circle cx="1020" cy="250" r="320" fill="url(#ambient-purple)" class="glow-pulse" />

  <!-- Architectural Background Grid -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />

    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Animated Migration Pipelines / Flow Corridors (Background Layer) -->
  <g fill="none">
    <!-- Top Stream -->
    <path d="M 50,80 C 320,30 450,140 750,70 S 1050,40 1150,90" 
          stroke="url(#pipeline-grad-1)" stroke-width="3" class="pipeline-flow-1" filter="url(#neon-glow)"/>
    <path d="M 50,80 C 320,30 450,140 750,70 S 1050,40 1150,90" 
          stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Bottom Stream -->
    <path d="M 50,280 C 300,330 480,220 780,290 S 1020,330 1150,260" 
          stroke="url(#pipeline-grad-2)" stroke-width="3" class="pipeline-flow-2" filter="url(#neon-glow)"/>
    <path d="M 50,280 C 300,330 480,220 780,290 S 1020,330 1150,260" 
          stroke="#c084fc" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Micro Stream Connections -->
    <path d="M 120,180 C 260,250 340,90 520,160" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 8" stroke-opacity="0.3"/>
    <path d="M 680,180 C 820,270 940,110 1080,180" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 8" stroke-opacity="0.3"/>
  </g>

  <!-- Dynamic Network Nodes / Data Hubs with Pulse Effect -->
  <g>
    <!-- Node 1 -->
    <circle cx="160" cy="72" r="6" fill="#38bdf8" />
    <circle cx="160" cy="72" r="5" fill="none" stroke="#38bdf8" stroke-width="2" class="node-pulse" />

    <!-- Node 2 -->
    <circle cx="1040" cy="84" r="6" fill="#818cf8" />
    <circle cx="1040" cy="84" r="5" fill="none" stroke="#818cf8" stroke-width="2" class="node-pulse" />

    <!-- Node 3 -->
    <circle cx="180" cy="285" r="6" fill="#a855f7" />
    <circle cx="180" cy="285" r="5" fill="none" stroke="#a855f7" stroke-width="2" class="node-pulse" />

    <!-- Node 4 -->
    <circle cx="1020" cy="275" r="6" fill="#ec4899" />
    <circle cx="1020" cy="275" r="5" fill="none" stroke="#ec4899" stroke-width="2" class="node-pulse" />
  </g>

  <!-- Floating Workload Badges / Dynamic Pills in Margins -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
    <!-- Pill 1: Top Left -->
    <g class="pill-float-1" transform="translate(70, 36)">
      <rect width="180" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="18" cy="16" r="4" fill="#38bdf8"/>
      <text x="32" y="21" fill="#e2e8f0">☁️ Cloud Lift &amp; Shift</text>
    </g>

    <!-- Pill 2: Top Right -->
    <g class="pill-float-2" transform="translate(950, 36)">
      <rect width="180" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="18" cy="16" r="4" fill="#818cf8"/>
      <text x="32" y="21" fill="#e2e8f0">🔄 Zero-Downtime CDC</text>
    </g>

    <!-- Pill 3: Bottom Left -->
    <g class="pill-float-3" transform="translate(70, 292)">
      <rect width="200" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="18" cy="16" r="4" fill="#a855f7"/>
      <text x="32" y="21" fill="#e2e8f0">🗄️ Database &amp; Object Sync</text>
    </g>

    <!-- Pill 4: Bottom Right -->
    <g class="pill-float-4" transform="translate(950, 292)">
      <rect width="180" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="18" cy="16" r="4" fill="#ec4899"/>
      <text x="32" y="21" fill="#e2e8f0">⚡ Server P2V &amp; V2V</text>
    </g>
  </g>

  <!-- Center Protected Foreground Backdrop Card (Ensures text stays clear & prominent) -->
  <g transform="translate(230, 95)">
    <rect width="740" height="170" rx="20" fill="#030712" fill-opacity="0.75" stroke="#334155" stroke-width="1.2" filter="url(#text-shadow)"/>
  </g>

  <!-- FOREGROUND BRANDING TEXT (Always on top, crisp and vibrant) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    
    <!-- Category Badge -->
    <g transform="translate(600, 126)">
      <rect x="-115" y="-14" width="230" height="26" rx="13" fill="#1e293b" stroke="#6366f1" stroke-width="1.2"/>
      <text x="0" y="3.5" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">ENTERPRISE ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="186" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5" filter="url(#text-shadow)">
      🚀 Awesome Migration Services
    </text>

    <!-- Gradient Accents for Subtitle & Description -->
    <text x="600" y="222" font-size="16" font-weight="600" fill="url(#primary-glow)">
      Cloud Migration • Server Replication • Database Transfer • Storage Sync
    </text>

    <text x="600" y="246" font-size="13" font-weight="400" fill="#94a3b8">
      A curated guide to leading SaaS migration suites and self-hosted open-source tooling
    </text>
  </g>

  <!-- Outer Neon Border Accent -->
  <rect width="1196" height="356" x="2" y="2" rx="15" fill="none" stroke="url(#primary-glow)" stroke-width="1.5" stroke-opacity="0.5"/>
</svg>
